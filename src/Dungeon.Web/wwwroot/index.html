      content="A first-person dungeon runner in your browser, rendered with Skia 2D only: one SKMesh and SkSL shaders, no 3D API used. A DrawnUI for .NET sample."

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Dungeon Run",
        "url": "https://dungeonnet.drawnui.net/",
        "image": "https://dungeonnet.drawnui.net/og.jpg",
        "description": "A first-person dungeon runner you play in your browser. It is drawn with Skia 2D only: one SKMesh and SkSL shaders, no 3D engine. A DrawnUI for .NET sample.",
        "genre": "Endless runner",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "playMode": "SinglePlayer",
        "inLanguage": "en",
        "author": { "@type": "Organization", "name": "DrawnUI", "url": "https://drawnui.net/" }
      }
    </script>

    <link rel="icon" href="favicon.ico" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      /* 100dvh: the part of the screen the browser's own bars leave free. With 100vh, Safari on an
         iPhone puts the bottom of the canvas under its toolbar. */
      #canvas { width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
      /* The loader: the game's title over a torch-lit glow, and the real download progress (main.js sets
         --load-pct from the runtime's download events), faded out when the game starts. */
      @font-face { font-family: "Orbitron Black"; src: url("fonts/Orbitron-Black.ttf"); font-display: block; }
      .loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 22px; background: radial-gradient(ellipse at 50% 55%, #2a1406 0%, #000 65%); transition: opacity 0.3s; }
      .loader.done { opacity: 0; pointer-events: none; }
      .loader-title { font: 44px "Orbitron Black", system-ui, sans-serif; letter-spacing: 2px; text-align: center;
                      background: linear-gradient(#fff4d0, #ffc050 55%, #d06810); -webkit-background-clip: text;
                      background-clip: text; color: transparent; animation: torch 1.6s ease-in-out infinite; }
      .loader-bar { width: min(260px, 60vw); height: 4px; border-radius: 2px; background: #2a1d10; overflow: hidden; }
      .loader-fill { height: 100%; width: var(--load-pct, 0%); transition: width 0.2s;
                     background: linear-gradient(90deg, #d06810, #ffc050); box-shadow: 0 0 10px #ff8a20; }
      .loader-text { font: 12px "Orbitron Black", system-ui, sans-serif; letter-spacing: 3px; color: #8a7a66; }
      .loader-text::after { content: " " var(--load-pct-text, ""); }
      @keyframes torch {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 138, 32, 0.45)); }
        35% { filter: drop-shadow(0 0 22px rgba(255, 138, 32, 0.8)); }
        60% { filter: drop-shadow(0 0 14px rgba(255, 110, 20, 0.55)); }
      }
      @media (prefers-reduced-motion: reduce) { .loader-title { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="loader" id="loader" role="progressbar" aria-label="Loading Dungeon Run">
      <div class="loader-title">DUNGEON RUN</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <div class="loader-text">LOADING</div>
    </div>
    <noscript>
      <h1>Dungeon Run</h1>
      <p>
        A first-person dungeon runner drawn with DrawnUI for .NET: Skia 2D only, one SKMesh and SkSL shaders, no 3D
        engine. The game needs JavaScript and WebGL 2 to run.
      </p>
      <p><a href="https://drawnui.net/">DrawnUI</a></p>
    </noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
